<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Medicamentos na Gestação (Protótipo Local)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<main class="max-w-3xl mx-auto p-6 bg-white rounded-3xl shadow-xl space-y-6">
    <header>
        <a href="index.html" class="text-sm text-violet-700 underline">← Início</a>
        <h1 class="text-3xl font-bold text-gray-800 mt-2">Medicamentos na Gestação e Lactação</h1>
        <p class="text-gray-600">Protótipo com base local: funciona sem IA, sem login e offline.</p>
        <p id="aviso-base" class="mt-2 text-sm p-3 rounded-xl bg-red-50 border border-red-200 text-red-800"></p>
    </header>

    <div>
        <label for="med-input" class="block font-semibold text-gray-700 mb-1">Medicamento (nome genérico ou comercial)</label>
        <input id="med-input" type="search" autocomplete="off" placeholder="Ex.: paracetamol, Tylenol, metformna…"
               class="w-full p-3 border border-gray-300 rounded-xl text-lg focus:ring-2 focus:ring-violet-500">
        <ul id="sugestoes" class="mt-2 divide-y border rounded-xl hidden" role="listbox"></ul>
    </div>

    <p id="vazio" class="hidden p-3 bg-yellow-50 border border-yellow-200 text-yellow-900 rounded-xl" role="status"></p>

    <section id="resultado" class="hidden space-y-4" aria-live="polite">
        <div>
            <h2 id="res-nome" class="text-2xl font-bold text-gray-800"></h2>
            <p id="res-classe" class="text-gray-500 text-sm"></p>
        </div>
        <div id="gest-card" class="p-5 rounded-2xl border-2">
            <p class="text-xs font-bold uppercase tracking-wide">Gestação</p>
            <p id="res-cat" class="text-3xl font-black"></p>
            <p id="res-gest" class="text-sm font-medium mt-1"></p>
        </div>
        <div id="lact-card" class="p-5 rounded-2xl border-2">
            <p class="text-xs font-bold uppercase tracking-wide">Lactação</p>
            <p id="res-lact-status" class="text-xl font-black"></p>
            <p id="res-lact" class="text-sm font-medium mt-1"></p>
        </div>
        <div class="p-5 rounded-2xl bg-gray-50 border">
            <p class="text-xs font-bold uppercase tracking-wide text-gray-500">Conduta / alternativas</p>
            <p id="res-alt" class="text-sm text-gray-800 mt-1"></p>
        </div>
        <p id="res-fonte" class="text-xs text-gray-500"></p>
    </section>
</main>
<script src="assets/busca-medicamentos.js"></script>
<script>
(async function () {
    const $ = id => document.getElementById(id);
    const CORES = {
        verde: ['bg-green-50', 'border-green-500', 'text-green-800'],
        amarelo: ['bg-yellow-50', 'border-yellow-400', 'text-yellow-800'],
        vermelho: ['bg-red-50', 'border-red-500', 'text-red-800'],
    };
    function pintar(el, cor) {
        el.className = 'p-5 rounded-2xl border-2 ' + CORES[cor].join(' ');
    }
    const corGest = c => (c === 'A' || c === 'B') ? 'verde' : c === 'C' ? 'amarelo' : c === 'Não classificado' ? 'amarelo' : 'vermelho';
    const corLact = s => /seguro|baixo/i.test(s) ? 'verde' : /moderado/i.test(s) ? 'amarelo' : 'vermelho';

    let base;
    try {
        base = await (await fetch('data/medicamentos.json')).json();
    } catch (e) {
        $('vazio').textContent = 'Não foi possível carregar a base de medicamentos.';
        $('vazio').classList.remove('hidden');
        return;
    }
    $('aviso-base').textContent = base.aviso + ` (${base.medicamentos.length} medicamentos, ${base.versao})`;
    const indice = BuscaMedicamentos.indexar(base.medicamentos);

    function mostrar(m) {
        $('sugestoes').classList.add('hidden');
        $('vazio').classList.add('hidden');
        $('res-nome').textContent = m.nome;
        $('res-classe').textContent = m.classe + (m.sinonimos.length ? ' · também: ' + m.sinonimos.join(', ') : '');
        $('res-cat').textContent = 'Categoria ' + m.gestacao.categoria;
        $('res-gest').textContent = m.gestacao.texto;
        $('res-lact-status').textContent = m.lactacao.status;
        $('res-lact').textContent = m.lactacao.texto;
        $('res-alt').textContent = m.alternativas;
        $('res-fonte').textContent = `Fonte: ${m.fonte} · revisado em ${m.revisado}`;
        pintar($('gest-card'), corGest(m.gestacao.categoria));
        pintar($('lact-card'), corLact(m.lactacao.status));
        $('resultado').classList.remove('hidden');
    }

    function atualizar() {
        const q = $('med-input').value;
        const lista = $('sugestoes');
        lista.textContent = '';
        $('vazio').classList.add('hidden');
        if (!q.trim()) { lista.classList.add('hidden'); $('resultado').classList.add('hidden'); return; }
        const { exato, sugestoes } = BuscaMedicamentos.buscar(indice, q);
        if (exato) { mostrar(exato); return; }
        $('resultado').classList.add('hidden');
        if (!sugestoes.length) {
            lista.classList.add('hidden');
            $('vazio').textContent = 'Medicamento não encontrado na base. Consulte uma fonte de referência (ex.: LactMed, bula).';
            $('vazio').classList.remove('hidden');
            return;
        }
        sugestoes.forEach(m => {
            const li = document.createElement('li');
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'w-full text-left p-3 hover:bg-violet-50';
            b.textContent = m.nome + ' — ' + m.classe;
            b.addEventListener('click', () => { $('med-input').value = m.nome; mostrar(m); });
            li.appendChild(b);
            lista.appendChild(li);
        });
        lista.classList.remove('hidden');
    }
    $('med-input').addEventListener('input', atualizar);
})();
</script>
<script src="assets/aviso.js" defer></script>
</body>
</html>
